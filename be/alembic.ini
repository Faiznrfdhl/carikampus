[alembic]
# path to migration scripts
script_location = app/db/migrations

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# version location specification
version_locations = %(here)s/app/db/migrations/versions

version_path_separator = os

# output encoding
output_encoding = utf-8

# Database URL is overridden dynamically in app/db/migrations/env.py
sqlalchemy.url = 

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
